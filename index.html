function minutes(text){
let sum=0;
for(const interval of text.trim().split(/[\/|]/)){
const m=interval.trim().match(/^(\d{1,2})(?:[:.](\d{2}))?\s*[-–—]\s*(\d{1,2})(?:[:.](\d{2}))?$/);
if(!m)return null;
const [h,a,j,b]=m.slice(1).map(x=>Number(x||0));
const diff=(j-h)*60+b-a;

sum+=diff;
}return sum;
}
