 $$('[data-n]').forEach(el=>{const n=+el.dataset.n,dc=+el.dataset.d||0,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1100),q=1-Math.pow(1-p,3);el.textContent=(n*q).toLocaleString('it-IT',{minimumFractionDigits:dc,maximumFractionDigits:dc});if(p<1)requestAnimationFrame(f)})(t0)});}
const stat=(n,l,d=0)=>`<div class="st"><b data-n="${n}" data-d="${d}">0</b><span>${l}</span></div>`;
function bind(){$('#dt').onclick=data;$('#th').onclick=()=>rt(document.documentElement.dataset.theme=='dark'?'light':'dark')}
function boom(e){const c=['#4f8cff','#7dd3fc','#1d4ed8','#fff','#a5b4fc'];for(let i=0;i<30;i++){const p=document.createElement('i');p.className='cf';p.style.cssText=`left:${e.clientX+(Math.random()-.5)*320}px;top:${e.clientY-220}px;width:8px;height:12px;background:${c[i%5]};border-radius:2px;animation-delay:${Math.random()*.3}s`;document.body.appendChild(p);setTimeout(()=>p.remove(),2300)}}
const tms=d=>{const t=d.tm;if(!t||!t.some(Boolean))return'';return [[0,1],[2,3]].filter(p=>t[p[0]]||t[p[1]]).map(p=>t[p[0]]+'–'+t[p[1]]).join(' | ')+'<br>'};
function topTools(ds){const c={};ds.forEach(d=>d.mat.forEach(x=>{const k=x.trim();c[k]=(c[k]||0)+1}));const a=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5);if(!a.length)return'';const m=a[0][1];return `<div class="sec" style="margin-top:18px"><h4>🏆 Strumenti più usati</h4>${a.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${v/m*100}%"></i><b>${v}</b></div>`).join('')}</div>`}
function home(){const t=tot(S.days),h=new Date().getHours(),g=h<6?'Buonanotte':h<13?'Buongiorno':h<18?'Buon pomeriggio':'Buonasera';
 show(`<section class="hero h"><span class="greet">${g}, Mirko</span><h1>${'Il diario delle mie giornate di lavoro'.split(' ').map((w,i)=>`<span style="animation-delay:${i*.09}s">${w}</span>`).join(' ')}</h1><p class="lead">Giorno dopo giorno, quello che faccio e quello che imparo.</p><button class="dcard sp" id="go"><span class="pill">Formazione Scuola-Lavoro</span><h3>Il mio diario</h3><div class="yr">${[4,5].filter(y=>y==4||yd(y).length).map(y=>{const t=tot(yd(y));return `<div class="yrow"><b class="yn">${y}</b><div class="yd">${stat(t.g,'giorni')}${stat(t.o,'ore')}${stat(t.t,'strumenti')}</div></div>`}).join('')}</div><div class="go"><span class="warn">Tocca per aprire</span><span class="ar">→</span></div></button><div class="rw"><button class="ib" id="rnd">🎲 Giorno a caso</button><button class="ib" id="dt">⚙️ Dati</button><button class="ib" id="th">◐ Tema</button></div></section>`,'home');
 bind();$('#go').onclick=e=>{boom(e);setTimeout(years,380)};
 $('#rnd').onclick=()=>{const d=S.days[Math.random()*S.days.length|0];if(d){year(d.y);detail(d.id)}}}
function years(){const c=y=>{const m=S.meta[y],t=tot(yd(y)),n=t.g>0;return `<button class="yc sp ${n?'':'new'}" data-y="${y}"><span class="big">${y}</span><h3>Classe ${y===4?'quarta':'quinta'}</h3><p>${esc(m.az||'Stage in arrivo')}${m.per?' – '+esc(m.per):''}</p><div class="ft">${n?`<span class="tag">${t.g} giorni</span><span class="tag">${nf(t.o)} ore</span>`:'<span class="tag">Inizia a scrivere</span>'}</div></button>`};
 show(`<section><button class="back" id="b">← Home</button><h2>Scegli un anno</h2><p class="sub">Apri un’esperienza e sfoglia le giornate.</p><div class="grid">${c(4)}${c(5)}</div></section>`,'years');
 $('#b').onclick=home;$$('.yc').forEach(b=>b.onclick=e=>{boom(e);setTimeout(()=>year(+b.dataset.y),300)})}
function year(y){const m=S.meta[y],ds=yd(y),t=tot(ds),wk={};
 ds.forEach(d=>{const x=fd(d.date),mo=new Date(x);mo.setDate(x.getDate()-(x.getDay()+6)%7);const k=mo.toISOString().slice(0,10);(wk[k]=wk[k]||[]).push(d)});
 const ks=Object.keys(wk).sort();
 const h=ks.map((k,i)=>`<div class="wk">Settimana dal ${L(k,{day:'numeric',month:'long'})} – ${nf(wk[k].reduce((a,d)=>a+(+d.ore||0),0))} h</div><div class="days">${wk[k].map(d=>{const x=fd(d.date),n=O.filter(o=>d[o[0]]&&d[o[0]].length).length;return `<button class="day sp" data-id="${d.id}"><div class="dn"><b>${x.getDate()}</b><span>${L(d.date,{month:'short'})}</span></div><div class="db"><h3>${L(d.date,{weekday:'long'})}</h3><ul>${d.att.slice(0,2).map(a=>`<li>${esc(a)}</li>`).join('')}</ul><div class="tg"><span class="tag">${d.att.length} attività</span><span class="tag">${d.mat.length} strumenti</span>${n?`<span class="tag">+${n} sezioni</span>`:''}</div></div><span class="hr">${d.mood||''} ${nf(d.ore)} h</span></button>`}).join('')}</div>`).join('');
 show(`<section><button class="back" id="b">← Scegli un anno</button><h2>Classe ${y===4?'quarta':'quinta'}</h2><div class="meta">${m.az?`<span class="tag">${esc(m.az)}</span>`:''}${m.per?`<span class="tag">${esc(m.per)}</span>`:''}${m.luogo?`<span class="tag">${esc(m.luogo)}</span>`:''}<button class="tag" id="em" style="cursor:pointer">Modifica info</button></div>${m.nota?`<div class="quote">${esc(m.nota)}</div>`:''}<div class="stats" style="margin:0 0 6px">${stat(t.g,'giorni')}${stat(t.o,'ore totali',2)}${stat(t.t,'strumenti')}</div>${topTools(ds)}<div class="tools"><input id="q" type="search" placeholder="Cerca attività, strumenti, appunti…"><button class="btn sm" id="add">+ Nuovo giorno</button></div><div id="list">${h||`<div class="empty" style="margin-top:28px"><b>Il diario è ancora vuoto</b>Aggiungi la prima giornata con il pulsante qui sopra.</div>`}</div></section>`,'year',y);
 $('#b').onclick=years;$('#add').onclick=()=>edit(null,y);$('#q').oninput=e=>{const v=e.target.value.toLowerCase();$$('.day').forEach(b=>{const d=S.days.find(x=>x.id==b.dataset.id);b.style.display=JSON.stringify(d).toLowerCase().includes(v)?'':'none'});$$('.wk').forEach(w=>{const n=w.nextElementSibling,ok=n&&$$('.day',n).some(x=>x.style.display!='none');w.style.display=ok?'':'none';if(n)n.style.display=ok?'':'none'})};$('#em').onclick=()=>info(y);$$('.day').forEach(b=>b.onclick=()=>detail(b.dataset.id))}
let mo;
function modal(h){closeM();mo=document.createElement('div');mo.className='ov';mo.innerHTML=`<div class="sheet">${h}</div>`;mo.onclick=e=>{if(e.target==mo)closeM()};document.body.appendChild(mo);document.body.style.overflow='hidden';return mo}
function closeM(){if(mo){mo.remove();mo=null;document.body.style.overflow=''}}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
const ul=a=>`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
function detail(id){const d=S.days.find(x=>x.id==id);if(!d)return;const ds=yd(d.y),i=ds.indexOf(d);
 let h=`<div class="sh-h"><div><h3>${d.mood?d.mood+' ':''}${L(d.date,{weekday:'long',day:'numeric',month:'long'})}</h3><span class="hr" style="white-space:normal">${tms(d)}${nf(d.ore)} ore – ${S.meta[d.y].az?esc(S.meta[d.y].az):'Stage'}</span></div><button class="x" id="cl" aria-label="Chiudi">✕</button></div>`;
 h+=`<div class="sec"><h4>✅ Attività svolte</h4>${d.att.length?ul(d.att):'<p>Nessuna attività inserita.</p>'}</div>`;
 if(d.app)h+=`<div class="sec"><h4>📝 Appunti</h4><p>${esc(d.app)}</p></div>`;
 if(d.mat.length)h+=`<div class="sec"><h4>🧰 Materiali usati</h4><div class="chips">${d.mat.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div>`;
 O.forEach(([k,l,t,e])=>{const v=d[k];if(v&&v.length)h+=`<div class="sec"><h4>${e} ${l}</h4>${t=='l'?ul(v):`<p>${esc(v)}</p>`}</div>`});
 h+=`<div class="acts"><button class="btn sm" id="ed">Modifica</button><button class="ib" id="cx">Copia</button><button class="ib" id="dl">Elimina</button><div class="nav"><button class="ib" id="pv" ${i<1?'disabled style="opacity:.4"':''}>←</button><button class="ib" id="nx" ${i>=ds.length-1?'disabled style="opacity:.4"':''}>→</button></div></div>`;
 modal(h);$('#cl').onclick=closeM;$('#ed').onclick=()=>edit(id);
 $('#pv').onclick=()=>i>0&&detail(ds[i-1].id);$('#nx').onclick=()=>i<ds.length-1&&detail(ds[i+1].id);
 $('#cx').onclick=async()=>{const t=`${L(d.date,{weekday:'long',day:'numeric',month:'long'})}\nAttività: ${d.att.join('; ')}\nMateriali: ${d.mat.join(', ')}${d.app?'\nAppunti: '+d.app:''}`;try{await navigator.clipboard.writeText(t);toast('Copiato')}catch(e){toast('Copia non riuscita')}};$('#dl').onclick=()=>ask('Eliminare questa giornata?',()=>{S.days=S.days.filter(x=>x.id!=id);save();closeM();year(d.y);toast('Giornata eliminata')})}
function ask(q,fn){modal(`<div class="sh-h"><h3 style="text-transform:none">${q}</h3></div><p class="warn">L’azione non si può annullare.</p><div class="acts"><button class="btn sm" id="ys">Conferma</button><button class="ib" id="no">Annulla</button></div>`);$('#no').onclick=closeM;$('#ys').onclick=fn}
function nextDate(y){const ds=yd(y);if(!ds.length)return y===5?'2026-10-26':'';const x=fd(ds[ds.length-1].date);do{x.setDate(x.getDate()+1)}while([0,6].includes(x.getDay()));return x.toISOString().slice(0,10)}
function edit(id,y){const d=id?S.days.find(x=>x.id==id):{y,date:nextDate(y),ore:'',att:[],mat:[],app:''};const ln=a=>(a||[]).join('\n');const tm=d.tm||(!id&&d.y===5?['08:00','13:00','14:00','17:00']:['','','','']);
 const on=new Set(O.filter(o=>d[o[0]]&&d[o[0]].length).map(o=>o[0]));
 modal(`<div class="sh-h"><h3 style="text-transform:none">${id?'Modifica giornata':'Nuova giornata'}</h3><button class="x" id="cl">✕</button></div>
 <label>Data</label><input type="date" id="f_date" value="${d.date}"><label>Orario</label><div class="tm">${['Mattina: inizio','Mattina: fine','Pomeriggio: inizio','Pomeriggio: fine'].map((l,k)=>`<div><small>${l}</small><input type="time" id="t${k}" value="${tm[k]}"></div>`).join('')}</div><label>Ore lavorate (si calcolano da sole, puoi correggerle)</label><input type="number" step="0.01" inputmode="decimal" id="f_ore" value="${d.ore}" placeholder="es. 8.00"><label>Com’è andata?</label><div class="opt" id="mo">${['😫','😕','🙂','😄','🤩'].map(e=>`<button data-e="${e}" class="${d.mood==e?'on':''}">${e}</button>`).join('')}</div>
 <label>Attività svolte (una per riga)</label><textarea id="f_att">${esc(ln(d.att))}</textarea><label>Appunti</label><textarea id="f_app">${esc(d.app)}</textarea><label>Materiali e strumenti usati (uno per riga)</label><textarea id="f_mat">${esc(ln(d.mat))}</textarea>
 <label>Aggiungi sezioni facoltative</label><div class="opt">${O.map(o=>`<button data-k="${o[0]}" class="${on.has(o[0])?'on':''}">${o[3]} ${o[1]}</button>`).join('')}</div>
 ${O.map(([k,l,t])=>`<div class="${on.has(k)?'':'hid'}" id="w_${k}"><label>${l}${t=='l'?' (uno per riga)':''}</label><textarea id="f_${k}">${esc(t=='l'?ln(d[k]):d[k]||'')}</textarea></div>`).join('')}
 <div class="acts"><button class="btn sm" id="sv">Salva</button><button class="ib" id="no">Annulla</button></div>`);
 $('#cl').onclick=$('#no').onclick=()=>id?detail(id):closeM();
 $$('#mo button').forEach(b=>b.onclick=()=>{const o=b.classList.contains('on');$$('#mo button').forEach(x=>x.classList.remove('on'));if(!o)b.classList.add('on')});
 $$('.tm input').forEach(i=>i.onchange=()=>{const m=v=>{const a=v.split(':');return a.length>1?a[0]*60+ +a[1]:null},v=[0,1,2,3].map(k=>m($('#t'+k).value));let s=0;if(v[0]!=null&&v[1]>v[0])s+=v[1]-v[0];if(v[2]!=null&&v[3]>v[2])s+=v[3]-v[2];if(s)$('#f_ore').value=(s/60).toFixed(2)});
 $$('.opt button[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;b.classList.toggle('on');$('#w_'+k).classList.toggle('hid');if(b.classList.contains('on'))$('#f_'+k).focus()});
 $('#sv').onclick=()=>{const g=k=>$('#f_'+k).value,ls=k=>g(k).split('\n').map(s=>s.trim()).filter(Boolean);if(!g('date')){toast('Inserisci la data');return}
  const n={id:d.id||Date.now().toString(36)+Math.random().toString(36).slice(2,5),y:d.y,date:g('date'),ore:parseFloat(g('ore'))||0,tm:[0,1,2,3].map(k=>$('#t'+k).value),mood:($('#mo .on')||{dataset:{}}).dataset.e||'',att:ls('att'),mat:ls('mat'),app:g('app').trim()};
  O.forEach(([k,,t])=>{if($('.opt [data-k="'+k+'"]').classList.contains('on')){const v=t=='l'?ls(k):g(k).trim();if(v.length)n[k]=v}});
  const i=S.days.findIndex(x=>x.id==n.id);i>=0?S.days[i]=n:S.days.push(n);save();closeM();year(n.y);toast('Giornata salvata');boom({clientX:innerWidth/2,clientY:innerHeight/3})}}
function info(y){const m=S.meta[y];modal(`<div class="sh-h"><h3 style="text-transform:none">Info sull’esperienza</h3><button class="x" id="cl">✕</button></div><label>Azienda o ente</label><input id="i_az" value="${esc(m.az)}"><label>Periodo</label><input id="i_per" value="${esc(m.per)}"><label>Luogo</label><input id="i_luogo" value="${esc(m.luogo)}"><label>Nota (orario, osservazioni del tutor…)</label><textarea id="i_nota">${esc(m.nota)}</textarea><div class="acts"><button class="btn sm" id="sv">Salva</button></div>`);
 $('#cl').onclick=closeM;$('#sv').onclick=()=>{['az','per','luogo','nota'].forEach(k=>m[k]=$('#i_'+k).value.trim());save();closeM();year(y);toast('Info salvate')}}
function data(){modal(`<div class="sh-h"><h3 style="text-transform:none">I tuoi dati</h3><button class="x" id="cl">✕</button></div><p class="warn">Tutto è salvato su questo dispositivo. Esporta il JSON per spostarlo su un altro dispositivo o per farmi preparare la presentazione.</p><textarea id="js" style="min-height:160px;font:13px monospace">${esc(JSON.stringify(S,null,1))}</textarea><div class="acts"><button class="btn sm" id="dw">Scarica .json</button><button class="ib" id="cp">Copia</button><button class="ib" id="fl">Importa da file</button><button class="ib" id="it">Importa dal testo</button></div><input type="file" id="fi" accept=".json,application/json" class="hid">`);
 $('#cl').onclick=closeM;const ta=$('#js');
 $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(ta.value)}catch(e){ta.select();document.execCommand('copy')}toast('JSON copiato')};
 $('#dw').onclick=async()=>{const nm='diario-fsl-'+new Date().toISOString().slice(0,10)+'.json';try{const d=await claude.use('downloads');if(d){await d.save({filename:nm,data:ta.value});return}}catch(e){}ta.select();toast('Download non disponibile: usa Copia')};
 $('#fl').onclick=()=>$('#fi').click();$('#fi').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>imp(t))};
 $('#it').onclick=()=>imp(ta.value)}
function imp(t){let o;try{o=JSON.parse(t)}catch(e){toast('JSON non valido');return}
 if(!o||!Array.isArray(o.days)||!o.meta){toast('File non riconosciuto');return}
 ask(`Sostituire i dati attuali con ${o.days.length} giornate importate?`,()=>{S=o;save();closeM();years();toast('Dati importati')})}
const rt=t=>document.documentElement.dataset.theme=t;rt(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeM()});
document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.sp');if(c){const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;c.style.setProperty('--mx',x+'px');c.style.setProperty('--my',y+'px');if(c.classList.contains('yc')){c.style.transform=`perspective(800px) rotateX(${(.5-y/r.height)*8}deg) rotateY(${(x/r.width-.5)*8}deg) translateY(-4px)`}}
 const px=e.clientX/innerWidth-.5,py=e.clientY/innerHeight-.5;$$('.bg i').forEach((b,i)=>b.style.transform=`translate(${px*(i+1)*30}px,${py*(i+1)*30}px)`)});
document.addEventListener('pointerout',e=>{const c=e.target.closest&&e.target.closest('.yc');if(c)c.style.transform=''});
home();
</script>
